name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qt-version: [5, 6]
        include:
          - qt-version: 6
            qt-base: 'qt6-base-dev'
            qt-multimedia: 'qt6-multimedia-dev'
          - qt-version: 5
            qt-base: 'qtbase5-dev'
            qt-multimedia: 'qtmultimedia5-dev'
            param: -DQT6=OFF

    steps:
    - name: install_qt_deps
      run: |
        sudo apt-get update
        sudo apt-get install ${{ matrix.qt-base }} ${{ matrix.qt-multimedia }}
    - name: install_deps
      run: sudo apt-get install cmake gettext libsndfile1-dev libmpg123-dev libvorbis-dev libopusfile-dev libgme-dev libsidplayfp-dev libstilview-dev libopenmpt-dev libmpcdec-dev libwavpack-dev libavcodec-dev libavformat-dev libbs2b-dev
    - uses: actions/checkout@v7
    - name: build
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug ${{ matrix.param }} ..
        cmake --build .

  build-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    strategy:
      matrix:
        sys: [UCRT64]

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        install: >-
          git
          base-devel
        pacboy: >-
          toolchain:p
          cmake:p
          gettext:p
          qt6-base:p
          qt6-shadertools:p
          qt6-multimedia:p
          libsndfile:p
          mpg123:p
          libvorbis:p
          opusfile:p
          libgme:p
          libmpcdec:p
          wavpack:p
          ffmpeg:p
          libbs2b:p
          libsidplayfp:p
          libopenmpt:p
          libadlmidi:p
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: build
      run: |
        export CXXFLAGS="-DUNICODE -D_UNICODE"
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug ..
        cmake --build .
